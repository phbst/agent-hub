server {
    listen 2102 ssl;
    listen [::]:2102 ssl;
    server_name _;

    ssl_certificate /etc/nginx/portal-cert/portal.crt;
    ssl_certificate_key /etc/nginx/portal-cert/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/agent-hub/current;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
